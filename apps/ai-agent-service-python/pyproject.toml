[project]
name = "ai-agent-service"
version = "0.1.0"
description = "Serviço de IA da Esteira Full Lab. Casa do Boleta (agente) e da extração usada pelo Camel."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn[standard]>=0.54,<1",
    "langgraph>=1.2,<2",
    "opentelemetry-api>=1.45,<2",
    "opentelemetry-sdk>=1.45,<2",
    "anthropic>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "httpx>=0.28,<1",
    "import-linter>=2.15,<3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

# ADR-0001: boleta e extraction são módulos irmãos e não se enxergam.
[tool.importlinter]
root_packages = ["boleta", "extraction"]

[[tool.importlinter.contracts]]
name = "boleta e extraction são independentes"
type = "independence"
modules = ["boleta", "extraction"]
